name: Dependabot auto-merge

# Dependabot の PR を、更新の種類で振り分ける。
# - パッチ・マイナー: 自動マージを予約する。実際のマージは、ruleset で必須にした CI が通ってから行われる
#   （CI が落ちればマージされずに残る）。main へのマージは Vercel / Render の本番デプロイにつながる
# - それ以外（メジャーなど）: needs-manual-review のラベルとコメントを付けて残し、手で判断する。
#   ずっと断る更新は、PR で @dependabot ignore を使うか、dependabot.yml の ignore に書く
#
# pull_request_target は使わない。Dependabot の PR の pull_request では、permissions で書き込み権限を渡せる
on:
  pull_request:
    types: [opened, reopened, synchronize]

permissions:
  contents: write
  pull-requests: write

jobs:
  triage:
    # actor は再実行した人に変わるので、PR の作成者で判定する
    if: github.event.pull_request.user.login == 'dependabot[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Fetch Dependabot metadata
        id: metadata
        uses: dependabot/fetch-metadata@25dd0e34f4fe68f24cc83900b1fe3fe149efef98 # v3.1.0
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}

      - name: Enable auto-merge for patch and minor updates
        if: >-
          steps.metadata.outputs.update-type == 'version-update:semver-patch' ||
          steps.metadata.outputs.update-type == 'version-update:semver-minor'
        run: gh pr merge --auto --merge "$PR_URL"
        env:
          PR_URL: ${{ github.event.pull_request.html_url }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      # synchronize（Dependabot のリベース）のたびにコメントが増えないよう、ラベルが無いときだけ付ける
      - name: Mark other updates for manual review
        if: >-
          steps.metadata.outputs.update-type != 'version-update:semver-patch' &&
          steps.metadata.outputs.update-type != 'version-update:semver-minor' &&
          !contains(github.event.pull_request.labels.*.name, 'needs-manual-review')
        run: |
          gh pr edit "$PR_URL" --add-label needs-manual-review
          gh pr comment "$PR_URL" --body "この更新（${UPDATE_TYPE:-種類不明}）は自動マージの対象外です。変更履歴と CI の結果を確認して、手でマージするか、\`@dependabot ignore this major version\` などで断ってください。"
        env:
          PR_URL: ${{ github.event.pull_request.html_url }}
          UPDATE_TYPE: ${{ steps.metadata.outputs.update-type }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
