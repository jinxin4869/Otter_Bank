name: CI

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

jobs:
  changes:
    runs-on: ubuntu-latest
    outputs:
      backend: ${{ steps.filter.outputs.backend }}
      frontend: ${{ steps.filter.outputs.frontend }}
    steps:
      - uses: actions/checkout@v7
      - uses: dorny/paths-filter@v4
        id: filter
        with:
          filters: |
            backend:
              - 'back/**'
            frontend:
              - 'front/**'

  check_ruby:
    needs: changes
    if: ${{ needs.changes.outputs.backend == 'true' }}
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./back

    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Set up Ruby
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: .ruby-version
          bundler-cache: true
          working-directory: ./back

      - name: Scan for security vulnerabilities
        run: bundle exec brakeman --no-pager --no-exit-on-warn

      - name: Lint code for consistent style
        run: bundle exec rubocop -f github

  lint_frontend:
    needs: changes
    if: ${{ needs.changes.outputs.frontend == 'true' }}
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./front
    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: "22"
          cache: "npm"
          cache-dependency-path: ./front/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Lint TypeScript/JavaScript style
        run: npm run lint

      - name: Type check
        run: npm run type-check

      - name: Run Jest tests
        run: npm run test

      - name: Build
        run: npm run build

  test_backend:
    needs: changes
    if: ${{ needs.changes.outputs.backend == 'true' }}
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./back

    services:
      postgres:
        image: postgres:15
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: otter_bank_test
        ports:
          - 5432:5432
        options: --health-cmd="pg_isready" --health-interval=10s --health-timeout=5s --health-retries=3

    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Install packages
        run: sudo apt-get update && sudo apt-get install --no-install-recommends -y build-essential libpq-dev pkg-config

      - name: Set up Ruby
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: .ruby-version
          bundler-cache: true
          working-directory: ./back

      - name: Setup database
        env:
          RAILS_ENV: test
          DATABASE_URL: postgres://postgres:postgres@localhost:5432/otter_bank_test
        run: |
          bin/rails db:create
          bin/rails db:schema:load

      - name: Run RSpec tests
        env:
          RAILS_ENV: test
          DATABASE_URL: postgres://postgres:postgres@localhost:5432/otter_bank_test
        run: bundle exec rspec --format documentation

  # 本番で使う Docker イメージをビルドし、production 設定で起動できるかを確かめる。
  # 必須の環境変数（ENV.fetch）の追加・Dockerfile・production でだけ読む initializer の変更は
  # RSpec（RAILS_ENV=test）では検出できず、マージ後の Render のデプロイで初めて落ちるため
  build_backend:
    needs: changes
    if: ${{ needs.changes.outputs.backend == 'true' }}
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:15
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: --health-cmd="pg_isready" --health-interval=10s --health-timeout=5s --health-retries=3

    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Build production image
        run: docker build -f back/Dockerfile -t otter-bank-api:ci back

      # 値はダミー。render.yaml の envVars に必須の変数を足したら、ここにも足す（足し忘れるとこのジョブが落ちる）
      - name: Boot with production settings
        run: |
          docker run -d --name api --network host \
            -e DATABASE_URL=postgres://postgres:postgres@localhost:5432/otter_bank_production \
            -e SECRET_KEY_BASE=ci-dummy-secret-key-base-0123456789abcdef0123456789abcdef \
            -e JWT_SECRET=ci-dummy-jwt-secret \
            -e SMTP_ADDRESS=smtp.example.com \
            -e SMTP_USERNAME=ci \
            -e SMTP_PASSWORD=ci \
            -e MAILER_FROM=ci@example.com \
            -e FRONTEND_URL=https://example.com \
            -e PORT=3000 \
            otter-bank-api:ci ./bin/rails server
          # エントリポイントが db:prepare（空の DB へのマイグレーション）を済ませてから puma が立ち上がる。
          # force_ssl のため、HTTPS 経由を示すヘッダーを付けて /up を叩く
          for _ in $(seq 1 60); do
            if curl -fsS -H 'X-Forwarded-Proto: https' http://localhost:3000/up > /dev/null; then
              echo "API booted with production settings"
              exit 0
            fi
            if [ "$(docker inspect -f '{{.State.Running}}' api)" != "true" ]; then
              break
            fi
            sleep 2
          done
          docker logs api
          exit 1

      - name: Stop container
        if: always()
        run: docker rm -f api || true
