version: 2
updates:
  # Ruby dependencies in back/
  - package-ecosystem: "bundler"
    directory: "/back"
    schedule:
      interval: "monthly"
    open-pull-requests-limit: 5
    ignore:
      # json 3 系は Rails 8.1 の JSON 解析と非互換で、JSON のリクエストが全て 400 になる（#376）。
      # Rails が対応したら、この ignore と Gemfile の固定を外す
      - dependency-name: "json"
        update-types: ["version-update:semver-major"]

  # npm dependencies in front/
  - package-ecosystem: "npm"
    directory: "/front"
    schedule:
      interval: "monthly"
    open-pull-requests-limit: 5

  # npm dependencies at the root（husky / lint-staged）
  - package-ecosystem: "npm"
    directory: "/"
    schedule:
      interval: "monthly"
    open-pull-requests-limit: 5

  # Docker dependencies。Dockerfile は back/ と front/ にあり、ルートには無い
  # （以前は directory: "/" で、どちらのイメージも更新されていなかった）
  - package-ecosystem: "docker"
    directories:
      - "/back"
      - "/front"
    schedule:
      interval: "monthly"
    open-pull-requests-limit: 5
    ignore:
      # メジャーは package.json の engines・.ruby-version・Gemfile と合わせて手で上げる
      - dependency-name: "node"
        update-types: ["version-update:semver-major"]
      - dependency-name: "ruby"
        update-types: ["version-update:semver-major"]

  # compose.yml の開発用イメージ（postgres）
  - package-ecosystem: "docker-compose"
    directory: "/"
    schedule:
      interval: "monthly"
    open-pull-requests-limit: 5
    ignore:
      # メジャーを上げると既存のボリュームのデータを読めなくなる
      - dependency-name: "postgres"
        update-types: ["version-update:semver-major"]

  # GitHub Actions
  - package-ecosystem: "github-actions"
    directory: "/.github/workflows"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 5
