version: 2
updates:
  # Ruby dependencies in back/
  - package-ecosystem: "bundler"
    directory: "/back"
    schedule:
      interval: "monthly"
    open-pull-requests-limit: 5
    ignore:
      # json 3 系は Rails 8.1 の JSON 解析と非互換で、JSON のリクエストが全て 400 になる（#376）。
      # Rails が対応したら、この ignore と Gemfile の固定を外す
      - dependency-name: "json"
        update-types: ["version-update:semver-major"]

  # npm dependencies in front/
  - package-ecosystem: "npm"
    directory: "/front"
    schedule:
      interval: "monthly"
    open-pull-requests-limit: 5

  # Docker dependencies
  - package-ecosystem: "docker"
    directory: "/"
    schedule:
      interval: "monthly"
    open-pull-requests-limit: 5

  # GitHub Actions
  - package-ecosystem: "github-actions"
    directory: "/.github/workflows"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 5
