# render.yaml
services:
  - type: web # Webサービスの定義
    name: otter-bank-api # サービス名
    env: ruby # 使用する環境
    region: oregon # デプロイ先のリージョン
    plan: free # プランの指定
    rootDir: back                    # バックエンドのディレクトリを指定
    buildCommand: bundle install && bundle exec rails db:migrate
    startCommand: bundle exec rails server -b 0.0.0.0 -p $PORT
    envVars:
      - key: RAILS_ENV
        value: production
      # JWT の署名鍵。Render が初回に強い乱数を生成し以後保持する。
      # 人が値を扱わないため、リポジトリや手元に鍵が残らない
      - key: JWT_SECRET
        generateValue: true
      - key: SECRET_KEY_BASE
        generateValue: true
      - key: WEB_CONCURRENCY
        value: 1
      # 本番 DB（Neon）の直接接続 URL（?sslmode=require 付き）。パスワードを含むため値はダッシュボードで設定する
      - key: DATABASE_URL
        sync: false
      # メール送信（パスワードリセット・問い合わせ確認）。値は Render のダッシュボードで設定する。
      # 未設定だと起動に失敗する（production.rb の smtp_settings が ENV.fetch で読むため）
      - key: SMTP_ADDRESS
        sync: false
      - key: SMTP_PORT
        value: 587
      - key: SMTP_USERNAME
        sync: false
      - key: SMTP_PASSWORD
        sync: false
      - key: MAILER_FROM
        sync: false
      # リセットメールのリンク先・CORS・OAuth の戻り先に使うフロントの URL
      - key: FRONTEND_URL
        sync: false
      # お問い合わせの通知先（運営のメールアドレス）。未設定なら通知しない
      - key: CONTACT_NOTIFY_TO
        sync: false
