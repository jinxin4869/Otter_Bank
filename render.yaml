# render.yaml
services:
  - type: web # Webサービスの定義
    name: otter-bank-api # サービス名
    env: ruby # 使用する環境
    region: oregon # デプロイ先のリージョン
    plan: free # プランの指定
    rootDir: back                    # バックエンドのディレクトリを指定
    buildCommand: bundle install && bundle exec rails db:migrate
    startCommand: bundle exec rails server -b 0.0.0.0 -p $PORT
    envVars:
      - key: RAILS_ENV
        value: production
      # JWT の署名鍵。Render が初回に強い乱数を生成し以後保持する。
      # 人が値を扱わないため、リポジトリや手元に鍵が残らない
      - key: JWT_SECRET
        generateValue: true
      - key: SECRET_KEY_BASE
        generateValue: true
      - key: WEB_CONCURRENCY
        value: 1

databases:
  - name: otter-bank-db
    databaseName: otter_bank_production
    user: otter_bank_user
    region: oregon
    plan: free